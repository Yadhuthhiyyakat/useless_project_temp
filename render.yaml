services:
  - type: web
    name: digital-cemetery-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        value: sqlite:////var/data/cemetery.db
      - key: CORS_ORIGINS
        sync: false
    disk:
      name: cemetery-data
      mountPath: /var/data
      sizeGB: 1
